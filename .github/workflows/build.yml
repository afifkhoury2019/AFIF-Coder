name: Build AFIF Coder installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.3.1"
  TEST_MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Cloud backends, attachments and key storage tests
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_backends.py *> unit.log
          $code = $LASTEXITCODE
          Get-Content unit.log
          if ($code -ne 0) {
            $f = (Get-Content unit.log | Select-String "FAIL " | Select-Object -First 10) -join "%0A"
            $t = (Get-Content unit.log -Tail 30) -join "%0A"
            Write-Host "::error title=Unit test failures::$f"
            Write-Host "::error title=Unit test log (end)::$t"
            exit 1
          }

      - name: Check model download links
        run: python tests/check_model_links.py

      - name: Fetch AFIF Engine (llama.cpp CPU + Vulkan builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/fetch_engine.py

      - name: Cache test model
        uses: actions/cache@v4
        with:
          path: testmodel
          key: testmodel-qwen25coder-3b-q4km

      - name: Engine + agent smoke test with a real model
        run: |
          if (-not (Test-Path testmodel\test.gguf)) {
            New-Item -ItemType Directory -Force testmodel | Out-Null
            Invoke-WebRequest $env:TEST_MODEL_URL -OutFile testmodel\test.gguf
          }
          $env:AFIF_ENGINE = (Resolve-Path engine\cpu\llama-server.exe).Path
          $env:AFIF_DATA = "$env:RUNNER_TEMP\afifdata"
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/smoke_engine.py testmodel\test.gguf *> smoke.log
          $code = $LASTEXITCODE
          Get-Content smoke.log
          if ($code -ne 0) {
            $out = (Get-Content smoke.log -Tail 25) -join "%0A"
            Write-Host "::error title=Smoke test output::$out"
            if (Test-Path "$env:AFIF_DATA\engine.log") {
              $log = (Get-Content "$env:AFIF_DATA\engine.log" -Tail 25) -join "%0A"
              Write-Host "::error title=Engine log::$log"
            }
            exit 1
          }

      - name: Cache built-in light model
        uses: actions/cache@v4
        with:
          path: models
          key: builtin-qwen3-1.7b-q4km

      - name: Fetch built-in light model (Qwen3 1.7B)
        run: |
          $ProgressPreference = "SilentlyContinue"
          $dest = "models\Qwen3-1.7B-Q4_K_M.gguf"
          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Force models | Out-Null
            $ok = $false
            foreach ($u in "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf",
                           "https://huggingface.co/bartowski/Qwen_Qwen3-1.7B-GGUF/resolve/main/Qwen_Qwen3-1.7B-Q4_K_M.gguf") {
              try { Invoke-WebRequest $u -OutFile $dest; $ok = $true; break } catch { Write-Host "failed: $u" }
            }
            if (-not $ok) { Write-Host "::error::Couldn't download the built-in model"; exit 1 }
          }
          Write-Host ("::notice title=Built-in model::Qwen3 1.7B, {0:N0} MB" -f ((Get-Item $dest).Length / 1MB))

      - name: Agent test with the built-in light model
        continue-on-error: true
        run: |
          $env:AFIF_ENGINE = (Resolve-Path engine\cpu\llama-server.exe).Path
          $env:AFIF_DATA = "$env:RUNNER_TEMP\afifdata3"
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/smoke_engine.py models\Qwen3-1.7B-Q4_K_M.gguf *> lite.log
          $code = $LASTEXITCODE
          Get-Content lite.log
          $out = (Get-Content lite.log -Tail 8) -join "%0A"
          if ($code -ne 0) { Write-Host "::warning title=Built-in model agent test::$out" } else { Write-Host "::notice title=Built-in model agent test passed::$out" }

      - name: Fetch bundled tools (Git, GitHub CLI, Node + REA, JDK + JADX, rclone, Python + Playwright)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/fetch_tools.py

      - name: Test bundled tools (skills' code, Playwright screenshots, REA MCP)
        run: |
          $env:AFIF_TOOLS = (Resolve-Path tools).Path
          python tests/test_windows_tools.py *> tools.log
          $code = $LASTEXITCODE
          Get-Content tools.log
          if ($code -ne 0) { $o = (Get-Content tools.log | Select-String "FAIL|Error|Traceback" | Select-Object -First 15) -join "%0A"; Write-Host "::error title=Bundled tools::$o"; exit 1 }

      - name: Claude Code inside AFIF Coder, on the built-in model (no API key)
        run: |
          $env:AFIF_ENGINE = (Resolve-Path engine\cpu\llama-server.exe).Path
          $env:AFIF_TOOLS = (Resolve-Path tools).Path
          $env:AFIF_DATA = "$env:RUNNER_TEMP\afifdata4"
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/smoke_claude_code.py models\Qwen3-1.7B-Q4_K_M.gguf *> cc.log
          $code = $LASTEXITCODE
          Get-Content cc.log
          $out = (Get-Content cc.log -Tail 30) -join "%0A"
          if ($code -eq 2) { Write-Host "::error title=Embedded Claude Code::$out"; exit 1 }
          if ($code -ne 0) { Write-Host "::warning title=Embedded Claude Code (small model didn't finish)::$out" }
          exit 0

      - name: Build app (PyInstaller, one folder)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed --name "AFIF-Coder"
          --icon icon.ico --add-data "afif_coder/icon.png;afif_coder"
          --version-file installer/version.txt
          --exclude-module tkinter
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQml --exclude-module PySide6.QtPdf
          main.py

      - name: Self-test the built app
        run: |
          $env:AFIF_DATA = "$env:RUNNER_TEMP\afifdata2"
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist\AFIF-Coder\AFIF-Coder.exe -ArgumentList "--selftest","$env:RUNNER_TEMP\shot.png" -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\shot.png")) { throw "App self-test failed (exit $($p.ExitCode))" }
          Copy-Item "$env:RUNNER_TEMP\shot.png" dist\selftest.png

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:APP_VERSION installer\AFIF-Coder.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test install and uninstall
        run: |
          $setup = "dist\AFIF-Coder-Setup-$env:APP_VERSION.exe"
          $dir = "$env:RUNNER_TEMP\AFIFInstall"
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/DIR=$dir" -Wait
          foreach ($f in "AFIF-Coder.exe", "engine\cpu\llama-server.exe", "engine\vulkan\llama-server.exe",
                       "skills\afif-app-rebuild\SKILL.md", "models\Qwen3-1.7B-Q4_K_M.gguf", "skills\reverse-engineer-anything\SKILL.md",
                       "tools\git\cmd\git.exe", "tools\gh\bin\gh.exe", "tools\node\node.exe", "tools\jdk\bin\java.exe",
                       "tools\jadx\jadx-headless-mcp-0.7.1-all.jar", "tools\rclone\rclone.exe", "tools\python\python.exe",
                       "tools\rea\node_modules\rea-agents\scripts\rea.mjs") {
            if (-not (Test-Path "$dir\$f")) { throw "Installed copy is missing $f" }
          }
          $cc = "$env:LOCALAPPDATA\AFIF-Coder\claude-code\node_modules\.bin\claude.cmd"
          if (Test-Path $cc) { Write-Host "::notice title=Installer::Claude Code was set up during install" } else { Write-Host "::warning title=Installer::Claude Code wasn't set up during install (the app installs it on first use)" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep 3
          if (Test-Path "$dir\AFIF-Coder.exe") { throw "Uninstall left files behind" }
          Write-Host ("::notice title=Installer::{0:N0} MB" -f ((Get-Item $setup).Length / 1MB))

      - uses: actions/upload-artifact@v4
        with:
          name: AFIF-Coder-Setup
          path: |
            dist/AFIF-Coder-Setup-*.exe
            dist/selftest.png

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: AFIF Coder ${{ env.APP_VERSION }}
          make_latest: true
          files: dist/AFIF-Coder-Setup-*.exe
          body: |
            Windows 10/11 (64-bit) installer. Download **AFIF-Coder-Setup-${{ env.APP_VERSION }}.exe** and run it.
            New in 1.3.1: Claude Code runs inside AFIF Coder's chat on this PC's model, with no API key or account
            (pick "Claude Code + <model>" in the model list); the installer sets it up.
            New in 1.3: Free Auto (free cloud models that switch when one hits its limit), GitHub Models, Groq,
            Mistral, Cerebras and OpenRouter free models, a built-in light model (Qwen3 1.7B), Claude Code running
            free on the local model, much smaller prompts per step, and the fixes from the debug report.
            Includes the AFIF Engine, skills (App Rebuild playbook, REA, Word/Excel/PowerPoint/PDF, UI checks) and
            helper tools: Git, GitHub CLI, Node.js + REA, Java JDK + JADX, rclone, Python + Playwright.
            After installing: pick a model, then open Connections to sign in to GitHub and Google Drive.
